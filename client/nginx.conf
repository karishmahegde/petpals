# Serves the built client in docker-compose, laid out like the Vercel
# deployment (vercel.json): /api/* is forwarded to the API container, so the
# refresh cookie is first-party, and every other path falls back to
# index.html so deep links and refreshes on nested routes work.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints these file names, so they can be cached for good.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
