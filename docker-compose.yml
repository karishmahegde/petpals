# What it does: runs the Express API and the React client in containers with
# one command — `docker compose up --build`. The database and file storage stay
# on Supabase: the API reads everything from server/.env, the same file local
# dev uses. Build the database once from the host first (README → Option B).

services:
  # ── Express API ──────────────────────────────────────────────
  server:
    build:
      context: ./server
    container_name: petpals_server
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── React Client ─────────────────────────────────────────────
  # Served by nginx, which forwards /api/* to the server container like
  # Vercel's rewrite does; the notification stream goes straight to the API.
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api/v1
        VITE_STREAM_URL: http://localhost:5000/api/v1
    container_name: petpals_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"
