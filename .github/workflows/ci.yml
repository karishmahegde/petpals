name: CI

on:
  pull_request:
    branches: [dev, main] # every PR into dev or main
  push:
    branches: [dev, main] # and anything that lands on them

permissions:
  contents: read # it only needs to read the code

concurrency: # a newer push cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholders: unit tests sign tokens with JWT_SECRET, and
      # prisma generate wants a DATABASE_URL. Nothing connects to it.
      JWT_SECRET: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit # fails below 80% lines / 70% branches

  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
